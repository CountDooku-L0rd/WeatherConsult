<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <link rel="stylesheet" href="./css/index.css" />
        <title>Консультант по погоде</title>
    </head>
    <body class="body">
        <main class="main">
            <h1 class="main__title">Консультант по погоде</h1>
            <section class="filters">
                <div class="filters__item">
                    <label class="filters__text" for="temperatureInput"
                        >Температура</label
                    >
                    <input
                        class="filters__temperature-input"
                        type="number"
                        value="24"
                        id="temperatureInput" />
                    <p class="filters__text">°C</p>
                </div>
                <div class="filters__item">
                    <label class="filters__text">Влажность</label>
                    <div class="custom-select">
                        <div
                            class="custom-select__trigger"
                            role="button"
                            tabindex="1"
                            aria-haspopup="listbox"
                            aria-expanded="false">
                            <p class="custom-select__text">средняя</p>
                            <span class="custom-select__arrow"></span>
                        </div>
                        <div
                            class="custom-select__options custom-select__options-hide"
                            role="listbox"
                            aria-hidden="true">
                            <ul class="custom-select__list">
                                <li
                                    class="custom-select__option custom-select__option-hover"
                                    role="option">
                                    низкая
                                </li>
                                <li
                                    class="custom-select__option custom-select__option-hover"
                                    role="option">
                                    средняя
                                </li>
                                <li
                                    class="custom-select__option custom-select__option-hover"
                                    role="option">
                                    высокая
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="filters__item">
                    <label class="filters__text custom-checkbox" for="precipitationInput">
                        Осадки
                        <input
                            class="filters__precipitation-checkbox"
                            type="checkbox"
                            id="precipitationInput" />
                        <span class="custom-checkmark"></span>
                    </label>
                </div>
            </section>
            <section class="result">
                <div>
                    <p class="result__text">
                        <span class="result__word-accent">Одежда:</span>
                        <span class="result__clothes-describe"
                            >Легкая, дышащая, короткие брюки и футболка.</span
                        >
                    </p>
                    <p class="result__text">
                        <span class="result__word-accent">Обувь:</span>
                        <span class="result__shoes-describe"
                            >Легкая — сандалии или открытые туфли.</span
                        >
                    </p>
                    <p class="result__text">
                        <span class="result__word-accent">Аксессуары:</span>
                        <span class="result__accessories-describe"
                            >Солнцезащитные очки, головной убор.</span
                        >
                    </p>
                </div>
                <img
                    class="result__img"
                    src="./assets/img/image1.jpg"
                    alt="Мужчина в лёгкой одежде стоит в парке" />
            </section>
            <section class="loading-result hidden">
                <img class="loading-result__preloader" src="assets/svg/preloader.svg" />
            </section>
            <section class="bad-result hidden">
                <p class="bad-result__text">Нет данных</p>
                <img
                    class="bad-result__img"
                    src="./assets/img/bad-result.webp"
                    alt="Изображение показывающее ошибку ввода" />
            </section>
        </main>
        <script src="./scripts/index.js" type="module"></script>
    </body>
</html>
